<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Marsh Hero Wireframes</title>
    <style>
      :root {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #0a1f2f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 60px 0 120px;
        background: #e9eef3;
      }

      h1 {
        text-align: center;
        font-size: 28px;
        margin-bottom: 40px;
        letter-spacing: 0.02em;
      }

      .wireframe {
        width: 1200px;
        height: 620px;
        margin: 30px auto;
        padding: 32px;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 30px 80px rgba(15, 36, 54, 0.15);
        display: flex;
        flex-direction: column;
        gap: 20px;
        border: 1px solid rgba(10, 31, 47, 0.08);
      }

      .wireframe-title {
        font-size: 18px;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: #5a7084;
      }

      .wireframe-grid {
        flex: 1;
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 24px;
      }

      .panel {
        border-radius: 20px;
        border: 2px dashed rgba(15, 36, 54, 0.3);
        padding: 32px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        position: relative;
      }

      .label {
        position: absolute;
        top: 18px;
        right: 24px;
        font-size: 12px;
        letter-spacing: 0.2em;
        color: #758da3;
        text-transform: uppercase;
      }

      .headline {
        height: 110px;
        border-radius: 12px;
        background: linear-gradient(90deg, #d6dee6, #f5f7fa);
      }

      .subcopy {
        height: 60px;
        border-radius: 12px;
        background: #f0f4f8;
      }

      .cta-row {
        display: flex;
        gap: 16px;
        margin-top: auto;
      }

      .cta {
        flex: 1;
        height: 52px;
        border-radius: 40px;
        background: #cfdce8;
      }

      .cta.secondary {
        background: #e4ebf3;
      }

      .media-panel {
        display: grid;
        grid-template-rows: repeat(3, 1fr);
        gap: 16px;
      }

      .media-block {
        border-radius: 18px;
        background: linear-gradient(135deg, #c0d8ea, #7db1d7);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.3);
      }

      .media-block.overlay::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 18px;
        background: linear-gradient(120deg, rgba(255, 255, 255, 0.25), transparent);
      }

      .media-block.overlay {
        position: relative;
      }

      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }

      .kpi {
        border-radius: 16px;
        padding: 18px;
        border: 2px dashed rgba(10, 31, 47, 0.25);
        background: #f9fbfc;
        height: 110px;
      }

      .tab-stack {
        display: grid;
        grid-template-rows: repeat(3, 1fr);
        gap: 12px;
      }

      .tab {
        border-radius: 14px;
        padding: 16px;
        border: 2px dashed rgba(10, 31, 47, 0.3);
        background: #f6f8fb;
      }

      .carousel-frame {
        flex: 1;
        border-radius: 20px;
        background: linear-gradient(120deg, #b7d1e7, #94c6de);
        border: 2px solid rgba(255, 255, 255, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.85);
        font-size: 20px;
        letter-spacing: 0.15em;
      }

      footer {
        text-align: center;
        color: #7790a8;
        font-size: 14px;
        margin-top: 80px;
      }
    </style>
  </head>
  <body>
    <h1>Marsh Hero Wireframe Explorations</h1>

    <section class="wireframe" id="wireframe-v1">
      <div class="wireframe-title">V1 · Narrative Spotlight</div>
      <div class="wireframe-grid">
        <div class="panel">
          <span class="label">Story Column</span>
          <div class="headline"></div>
          <div class="subcopy"></div>
          <div class="subcopy" style="height: 40px"></div>
          <div class="cta-row">
            <div class="cta"></div>
            <div class="cta secondary"></div>
          </div>
        </div>
        <div class="panel">
          <span class="label">Immersive Media</span>
          <div class="media-block overlay" style="grid-row: span 2"></div>
          <div class="media-block" style="height: 120px"></div>
        </div>
      </div>
    </section>

    <section class="wireframe" id="wireframe-v2">
      <div class="wireframe-title">V2 · Insight Deck</div>
      <div class="wireframe-grid">
        <div class="panel">
          <span class="label">Narrative + CTA</span>
          <div class="headline" style="height: 90px"></div>
          <div class="subcopy"></div>
          <div class="kpi-grid">
            <div class="kpi"></div>
            <div class="kpi"></div>
            <div class="kpi" style="grid-column: span 2"></div>
          </div>
          <div class="cta-row">
            <div class="cta"></div>
            <div class="cta secondary"></div>
          </div>
        </div>
        <div class="panel">
          <span class="label">Proof Module</span>
          <div class="media-panel">
            <div class="media-block" style="background: #dce7f1"></div>
            <div class="media-block" style="background: #c7d8eb"></div>
            <div class="media-block" style="background: #b4cde2"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="wireframe" id="wireframe-v3">
      <div class="wireframe-title">V3 · Journey Carousel</div>
      <div class="wireframe-grid">
        <div class="panel">
          <span class="label">CTA Stack</span>
          <div class="headline" style="height: 100px"></div>
          <div class="subcopy"></div>
          <div class="tab-stack">
            <div class="tab"></div>
            <div class="tab"></div>
            <div class="tab"></div>
          </div>
          <div class="cta-row">
            <div class="cta"></div>
            <div class="cta secondary"></div>
          </div>
        </div>
        <div class="panel">
          <span class="label">Immersive Carousel</span>
          <div class="carousel-frame">MEDIA ROTATOR</div>
        </div>
      </div>
    </section>

    <footer>Wireframes emphasize structure, not final styling.</footer>
  </body>
</html>
