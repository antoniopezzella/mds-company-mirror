<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Marsh - Global leader in insurance broking and risk management. We help clients navigate complexity and thrive through expert guidance and innovative solutions." />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Marsh - Insurance Broking and Risk Management" />
    <meta property="og:description" content="Global leader in insurance broking and risk management. Navigate complexity and thrive through expert guidance." />
    <meta property="og:image" content="/images/marsh-logo-brand.svg" />
    <meta property="og:url" content="https://www.marsh.com" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Marsh - Insurance Broking and Risk Management" />
    <meta name="twitter:description" content="Global leader in insurance broking and risk management." />
    <meta name="twitter:image" content="/images/marsh-logo-brand.svg" />
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()" />
    
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: https: blob:;
      connect-src 'self' http://localhost:3333;
      frame-src 'self' https://player.vimeo.com;
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self';
      upgrade-insecure-requests;
    " />
    
    <!-- Preconnect to improve performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    
    <title>Marsh Design System</title>

    <!--
      Sets the `dark` class before React mounts (and before first paint).
      Without this, ThemeModeProvider's own effect only runs after React's
      first commit — so on a page load where the stored preference is
      'dark', every getRoleColor() call that falls back to reading this
      class (see src/theme/roles.ts) would render light-mode colors for
      that first render, self-correcting only if something happens to
      trigger a second one. Same script for the same reason as every
      standard Tailwind dark-mode starter.
    -->
    <script>
      (function () {
        var stored = localStorage.getItem('mds-theme-mode');
        var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
