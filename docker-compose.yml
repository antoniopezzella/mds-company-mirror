services:
  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment: 
      - COLLECTOR_OTLP_ENABLED=true
    ports: 
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    networks:
      - mds-network

networks:
  mds-network:
    driver: bridge
