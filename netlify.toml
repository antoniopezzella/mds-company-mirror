# Build settings for Netlify
[build]
  command = "rm -rf storybook-static && npm run build-storybook"
  publish = "storybook-static"

# Node version
[build.environment]
  NODE_VERSION = "22"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    # Strict Transport Security (HSTS)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    
    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"
    
    # Control referrer information
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Restrict browser features
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), speaker=()"
    
    # Content Security Policy (Relaxed for Storybook)
    Content-Security-Policy = '''
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline';
      font-src 'self' data:;
      img-src 'self' data: https: blob:;
      connect-src 'self';
      frame-src 'self';
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self';
    '''
    
    # Cross-Origin policies (relaxed for Storybook iframes)
    # Cross-Origin-Embedder-Policy = "require-corp"  # Disabled for Storybook
    Cross-Origin-Opener-Policy = "same-origin"
    # Cross-Origin-Resource-Policy = "same-origin"  # Disabled for Storybook

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache fonts
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# Don't cache HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# SPA redirect rule for Storybook
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
