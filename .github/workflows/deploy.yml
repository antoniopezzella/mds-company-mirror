name: Design System Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run design system checks
        run: |
          npm run tokens:check
          npm run governance:ci
          npm run test
          npm run lint

      - name: Build tokens for deployment
        run: npm run tokens:build

      - name: Upload governance artifacts
        uses: actions/upload-artifact@v3
        with:
          name: governance-reports
          path: |
            governance-report.json
            governance-badge.json
            contrast-report.json
            contrast-badge.svg
            dist/

  deploy-preview:
    needs: quality-gates
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22' 
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel Preview
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: prj_09oJEVnuyBTRMyBuUGgbr97x8j5Q

  deploy-production:
    needs: quality-gates
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: prj_09oJEVnuyBTRMyBuUGgbr97x8j5Q
          vercel-args: '--prod'