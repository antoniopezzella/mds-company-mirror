name: Deploy Storybook to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        env:
          HUSKY: '0'            # never install git hooks on CI
        run: |
          # The self-hosted runner reuses $HOME across jobs; a corrupted npm
          # cacache entry from an earlier crashed run makes every subsequent
          # `npm ci` die with "Exit handler never called". Wipe it first.
          rm -rf "$HOME/.npm/_cacache" "$HOME/.npm/_logs" || true
          npm install -g npm@10.9.2 || true   # pin a known-good npm in case the runner's bundled npm is the crashing one
          npm ci --no-audit --no-fund

      - name: Build tokens
        run: npm run tokens:build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./storybook-static

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, Linux, X64]
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
