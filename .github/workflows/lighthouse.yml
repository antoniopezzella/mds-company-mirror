name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        run: npm run build
        
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          
      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: |
            lighthouse-reports/
            .lighthouseci/
          retention-days: 30
          
      - name: Comment PR with Lighthouse scores
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            try {
              // Read Lighthouse CI results
              const resultsPath = '.lighthouseci/lhr-*.json';
              const glob = require('glob');
              const files = glob.sync(resultsPath);
              
              if (files.length > 0) {
                const lhr = JSON.parse(fs.readFileSync(files[0], 'utf8'));
                const scores = lhr.categories;
                
                const comment = `## 🚀 Lighthouse Performance Report
                
| Category | Score |
|----------|-------|
| Performance | ${Math.round(scores.performance.score * 100)}/100 |
| Accessibility | ${Math.round(scores.accessibility.score * 100)}/100 |
| Best Practices | ${Math.round(scores['best-practices'].score * 100)}/100 |
| SEO | ${Math.round(scores.seo.score * 100)}/100 |

### Core Web Vitals
- **First Contentful Paint**: ${Math.round(lhr.audits['first-contentful-paint'].numericValue)}ms
- **Largest Contentful Paint**: ${Math.round(lhr.audits['largest-contentful-paint'].numericValue)}ms
- **Cumulative Layout Shift**: ${lhr.audits['cumulative-layout-shift'].numericValue.toFixed(3)}
- **Speed Index**: ${Math.round(lhr.audits['speed-index'].numericValue)}ms

[View full Lighthouse report in artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
                `;
                
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              }
            } catch (error) {
              console.log('Could not generate Lighthouse comment:', error);
            }