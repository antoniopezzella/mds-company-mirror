name: Design System Governance

on:
  pull_request:
    branches: [ main ]
  push:
    # No branch filter — see ci.yml for why.

jobs:
  governance-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Governance Report (strict)
        run: npm run governance:ci
      - name: Upload governance JSON artifact
        if: always()
        run: |
          node scripts/report-governance.js --json > governance-report.json
      - name: Store artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-report
          path: governance-report.json
