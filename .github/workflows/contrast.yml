name: Contrast Validation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/check-contrast.js'
      - 'package.json'
      - 'dist/tokens.json'
      - '.github/workflows/contrast.yml'
  push:
    # No branch filter — see ci.yml for why.
    paths:
      - 'src/**'
      - 'scripts/check-contrast.js'
      - 'package.json'
      - 'dist/tokens.json'
      - '.github/workflows/contrast.yml'

jobs:
  contrast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Build tokens
        run: npm run tokens:build
      - name: Contrast (JSON)
        id: contrast
        run: |
          node scripts/check-contrast.js --all --json > contrast-report.json || echo "status=$?" >> $GITHUB_OUTPUT
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: contrast-report
          path: contrast-report.json
      - name: Fail if contrast failed
        run: |
          node -e 'const r=require("fs").readFileSync("contrast-report.json","utf8");const j=JSON.parse(r);if(j.totalFailed>0){console.error("Contrast failures: "+j.totalFailed);process.exit(1)}'
