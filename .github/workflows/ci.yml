name: CI

# One workflow for build, tests and commit messages. It replaced ci.yml +
# contrast.yml + commitlint.yml on 2026-11-05: MMC has one shared
# self-hosted runner and no GitHub-hosted ones, so ubuntu-latest jobs never
# started and three workflows would queue three installs behind each other.
# Contrast is covered by tokens:check below (it runs check-contrast.js --all).
# Governance gates live in governance.yml.
#
# Dropped from the old ci.yml: `npx shadcn@latest registry validate` — it
# downloads an unpinned package at run time, which Artifactory's 2-day age
# delay can refuse. registry:check (in governance.yml) covers completeness.

on:
  pull_request:
    branches: [ main ]
  push:
    # No branch filter: substantial work happens on feature branches, and
    # restricting push to main meant they got zero CI signal until merge.

# The runner is shared, so a newer push cancels the superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: MMC setup (Node, Artifactory, install)
        uses: ./.github/actions/mmc-setup
        with:
          artifactory-token: ${{ secrets.ARTIFACTORY_NPM_TOKEN }}

      - name: Lint docs structure
        run: npm run docs:lint

      - name: Lint
        run: npm run lint

      - name: Token governance (build + diff policy + contrast)
        run: npm run tokens:check

      - name: Build (type + bundle)
        run: npm run build

      # Builds and validates what actually ships: the .d.ts once stopped
      # emitting for two exported providers with the JS still fine.
      - name: Build publishable package
        run: npm run build:package

      - name: Bundle-size budget
        run: npm run size

      # Unit tests run in jsdom and need no browser.
      - name: Unit tests
        run: npx vitest run --project unit

      # The storybook test project (axe on every story) needs Chromium. The
      # runner may not reach Playwright's browser CDN, so this probe never
      # fails the job: it reports what the runner has and decides whether
      # the browser steps run. Its log answers the platform-team question.
      - name: Browser probe
        id: browser
        continue-on-error: true
        run: |
          echo "--- system Chrome/Chromium"
          for b in google-chrome google-chrome-stable chromium chromium-browser; do
            command -v "$b" && "$b" --version || true
          done
          echo "--- Playwright CDN reachable?"
          curl -sS -o /dev/null -w '%{http_code}\n' --max-time 15 https://cdn.playwright.dev/ || echo "unreachable"
          echo "--- npx playwright install chromium"
          if timeout 300 npx playwright install chromium; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Chromium could not be installed on this runner — story/axe tests skipped. Ask the platform team for a browser or an Artifactory mirror (PLAYWRIGHT_DOWNLOAD_HOST)."
          fi

      - name: Story + accessibility tests
        if: steps.browser.outputs.ok == 'true'
        run: npx vitest run --project storybook

      # Proves the axe gate above actually ran checks; it once checked nothing
      # while reporting green on every story.
      - name: Accessibility gate self-test
        if: steps.browser.outputs.ok == 'true'
        run: npm run a11y:gate:check

      - name: Build Storybook
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run build-storybook

  commits:
    name: Commit messages
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --ignore-scripts: commitlint needs only its own packages.
      - name: MMC setup (Node, Artifactory, install)
        uses: ./.github/actions/mmc-setup
        with:
          artifactory-token: ${{ secrets.ARTIFACTORY_NPM_TOKEN }}
          install-args: --ignore-scripts

      # Runs the repo's own @commitlint/cli rather than a Docker-based
      # marketplace action, which needs Docker and an image pull
      # the runner may not allow. Merge commits
      # (the VDI relay makes one each sync) are ignored by default.
      - name: Commitlint
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            npx commitlint --from "$BASE" --to "$HEAD" --verbose
            echo "$PR_TITLE" | npx commitlint --verbose
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            npx commitlint --from "$BEFORE" --to "$GITHUB_SHA" --verbose
          else
            npx commitlint --last --verbose
          fi
