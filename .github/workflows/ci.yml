name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    # No branch filter: this repo does substantial work directly on
    # feature branches (not just main) — restricting push to main meant
    # active branches got zero CI signal until merge.

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint docs structure
        run: npm run docs:lint

      - name: Lint
        run: npm run lint

      - name: Token governance (build + diff policy)
        run: npm run tokens:check

      - name: Token diff markdown (always generate)
        run: |
          npm run tokens:build >/dev/null 2>&1 || true
          node scripts/diff-tokens.js --markdown > token-diff.md || true
          echo "\n## Token Diff" >> $GITHUB_STEP_SUMMARY
          cat token-diff.md >> $GITHUB_STEP_SUMMARY

      # The Storybook project runs real browser tests, and Vite's dependency
      # pre-bundling flakes on a cold cache under concurrent load. Persisting
      # the cache keeps CI off that path; the retry in vitest.config.ts covers
      # the first run on a cache miss.
      - name: Cache Storybook/Vite pre-bundle
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/storybook
            node_modules/.vite
          key: sb-prebundle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: sb-prebundle-${{ runner.os }}-

      - name: Unit & interaction tests
        run: npm test

      # Asserts the axe gate above is actually running. It silently checked
      # nothing once (vitest.config.ts:120-128) and a green suite looked
      # identical to a disabled one. Reuses the browser this job already has.
      - name: Accessibility gate self-test
        run: npm run a11y:gate:check

      - name: Build (type + bundle)
        run: npm run build

      # Nothing here previously built or validated what actually ships. Two
      # regressions reached main that way: the library's .d.ts stopped
      # emitting for two exported providers (JS fine, every TS consumer
      # broken), and registry.json kept pointing at a deleted component.
      # Both are caught by these two steps.
      - name: Build publishable package
        run: npm run build:package

      # Bundle-size budget on what actually ships (dist-pkg). Runs right after
      # the package is built so the artifacts it measures are the ones just
      # produced. Limits live in .size-limit.cjs, set ~12% above the measured
      # size — this catches the package growing unnoticed between releases.
      - name: Bundle-size budget
        run: npm run size

      # `registry validate` only checks that the FILE is well-formed. It will
      # happily pass a registry missing a quarter of the library — which is
      # exactly what happened: 71 listed against 94 on disk. This second step
      # checks it against the filesystem.
      - name: Validate shadcn registry
        run: npx -y shadcn@latest registry validate

      - name: Registry completeness
        run: npm run registry:check

      - name: Build Storybook (optional)
        run: npm run build-storybook
        if: ${{ github.event_name == 'pull_request' }}

      - name: Upload Storybook static (PR artifact)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 5

      - name: Summary
        if: always()
        run: |
          echo '## CI Summary' >> $GITHUB_STEP_SUMMARY
          echo '* docs:lint ✅' >> $GITHUB_STEP_SUMMARY
          echo '* lint ✅' >> $GITHUB_STEP_SUMMARY
          echo '* tokens:check ✅ (fails only on changed/removed primitives)' >> $GITHUB_STEP_SUMMARY
          echo '* tests ✅' >> $GITHUB_STEP_SUMMARY
          echo '* build ✅' >> $GITHUB_STEP_SUMMARY
