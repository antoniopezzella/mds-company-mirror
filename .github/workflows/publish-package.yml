name: Publish design system package

# Manual trigger only — this is a young, hand-scoped package (see
# docs/SHADCN_MIGRATION_STATUS.md) and shouldn't auto-publish on every push
# to main the way the app itself does. Bump "version" in package.json and
# run this workflow deliberately when a real release is ready.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mmctech'
      - run: npm ci

      # Gates. This workflow previously went straight from `npm ci` to
      # `npm publish` with nothing in between — so `main` being green told you
      # nothing about what was about to be published, and in practice a release
      # shipped with a broken index.d.ts (five re-exported modules had no .d.ts
      # emitted). CI running these on push is not a substitute: publish is
      # workflow_dispatch, so it can be fired from any ref at any time.
      - name: Lint
        run: npm run lint
      - name: Types (source)
        run: npx tsc -b --force
      - name: Unit & interaction tests
        run: npm test
      - name: Governance (tokens, roles, spacing, prop vocab, deprecations)
        run: npm run governance:ci

      # Builds the package AND type-checks the built artifact as a consumer
      # sees it — see scripts/check-package-types.js.
      - run: npm run build:package

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
