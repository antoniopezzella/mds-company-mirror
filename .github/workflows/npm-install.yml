name: NPM Install Workflow

on:
  push:
    branches: [main, develop]
    paths:
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main, develop]
    paths:
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch: # Allow manual trigger

jobs:
  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate
          npm audit --json > audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v3
        with:
          name: npm-audit-report
          path: audit-report.json

  dependency-check:
    name: Dependency Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate package.json
        run: |
          npm pkg validate
          echo "✅ package.json is valid"

      - name: Check for dependency conflicts
        run: |
          npm ls --depth=0 || echo "⚠️ Dependency conflicts detected"

      - name: Install dependencies (clean)
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Verify installation integrity
        run: |
          npm ci --dry-run
          echo "✅ Installation integrity verified"

  install-matrix:
    name: Install Test (${{ matrix.os }} - Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['20', '22']
        include:
          - os: ubuntu-latest
            node-version: '18' # Minimum supported version

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Clean install
        run: npm ci

      - name: Verify design system build
        run: |
          npm run tokens:build
          npm run build-storybook

      - name: Run quick tests
        run: npm test

  performance-check:
    name: Installation Performance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Measure install performance
        run: |
          echo "📊 Testing npm install performance..."
          time npm ci
          
          echo "📦 Package sizes:"
          npm list --depth=0 --json > package-list.json
          
          echo "🔍 Bundle analysis:"
          npm run build-storybook 2>&1 | grep -E "(kB|MB)" || true

      - name: Check bundle size
        run: |
          if [ -d "storybook-static" ]; then
            echo "📏 Storybook bundle size:"
            du -sh storybook-static/
            
            echo "🎯 Asset breakdown:"
            find storybook-static -name "*.js" -exec du -sh {} \; | sort -hr | head -10
          fi

  cache-optimization:
    name: Cache Strategy Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js with cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: First install (cache miss)
        run: |
          echo "⏱️ First install:"
          time npm ci

      - name: Second install (cache hit)
        run: |
          rm -rf node_modules
          echo "⚡ Cached install:"
          time npm ci

      - name: Verify cache effectiveness
        run: |
          echo "✅ Cache optimization verified"